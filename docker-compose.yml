services:

  frontend:
    build: ./client
    container_name: client
    image: mostafaelfar11/elfar-frontend:latest
    restart: always
    ports:
      - "80:80"
      - "5173:80"

  backend:
    build: ./server
    image: mostafaelfar11/elfar-backend:latest
    container_name: backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: Elfar
      MONGO_INITDB_ROOT_PASSWORD: GRJuFSAUdEWgImKW
      MONGO_INITDB_DATABASE: elfar_starter
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: